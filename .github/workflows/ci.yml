# @Software: resource-pulse
name: CI
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang cmake pkg-config \
            libssl-dev libfontconfig1-dev libfreetype6-dev libasound2-dev \
            libwayland-dev libxkbcommon-x11-dev libx11-xcb-dev \
            libxcb-shape0-dev libxcb-xfixes0-dev libvulkan1 mesa-vulkan-drivers fonts-noto-cjk \
            desktop-file-utils librsvg2-bin dpkg-dev
      - name: Install pinned Rust toolchain
        run: rustup show active-toolchain && rustup component add rustfmt clippy
      - name: Formatting
        run: cargo fmt --all --check
      - name: Lint
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Tests
        run: cargo test --workspace --all-targets --locked
      - name: Build
        run: cargo build --workspace --locked
      - name: Desktop package checks
        run: PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s scripts -p 'test_*.py' && desktop-file-validate packaging/io.github.fzf.Pulse.desktop
